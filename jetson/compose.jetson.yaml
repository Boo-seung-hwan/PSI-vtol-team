services:
  microxrce-agent:
    build:
      context: ../microxrce-agent
      dockerfile: Dockerfile
    container_name: microxrce-agent
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
    command: ["MicroXRCEAgent", "serial", "--dev", "/dev/ttyACM0", "-b", "921600"]
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4

  ros2-vision:
    build:
      context: ..
      dockerfile: jetson/Dockerfile.jetson
    container_name: ros2-vision
    network_mode: host
    privileged: true
    depends_on:
      - microxrce-agent
    volumes:
      - ../ros2:/workspace/ros2
      - ../models:/workspace/ml_models
      - /dev:/dev
    working_dir: /workspace/ros2
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - PYTHONUNBUFFERED=1
      - YOLO_DEVICE=cuda
    stdin_open: true
    tty: true
    command: bash