# ---------------------------------------------------------------------------
# raw_measurements: AS-MEASURED NUMBERS, PRESERVED VERBATIM
# ---------------------------------------------------------------------------
# These are NOT body-frame coordinates and are consumed by no dynamics code.
# They are kept after the 2026-09-16 datum resolution so the provenance chain
# stays auditable: every converted body-frame z above can be recomputed from
# this block, and tests do exactly that rather than trusting the converted
# literals.
raw_measurements:
  datum_status: RESOLVED
  datum_origin: floor
  datum_up_axis: "+z_up"
  datum_resolved_date: 2026-09-16
  datum_note: >-
    USER_CONFIRMED 2026-09-16: all z values in this block are heights
    measured from the FLOOR with +Z pointing UP. The simulation body frame is
    FRD (+X forward, +Y right, +Z DOWN) with its origin at the CG, so the
    conversion is an origin shift to the CG plus a Z sign flip:
    z_body_FRD = cg_raw_z - raw_z. Before this date the datum was undefined
    and only unsigned separations were recorded. USER_CONFIRMED 2026-09-19:
    the vehicle was in its normal landed pose, landing gear on the ground, so
    the "floor" is the ground plane (ground = 0); it converts to body z =
    0.241 - 0 = +0.241 m (see geometry.ground_clearance_m).
  # [0, 0, 0.241] m -- CG height above the floor (= above the ground, landed).
  cg_raw_m: [0.0, 0.0, 0.241]
  # 0.334 m -- motor-center height above the floor.
  motor_plane_raw_z_m: 0.334
  # [0, 0, 0.220] m -- battery-center height above the floor.
  battery_center_raw_m: [0.0, 0.0, 0.220]
  # 0.360 m -- horizontal, datum-independent (duplicated from
  # geometry.arm_length_m for locality; a test asserts they agree).
  motor_radial_distance_m: 0.360
  meta:
    source: MEASURED
    date: 2026-09-16
    confidence: high
    # Recorded as unsigned separations while the datum was undefined; the
    # signs below were fixed by the 2026-09-16 datum resolution. Kept under
    # the original magnitudes so the history stays legible.
    resolved_separations:
      # |0.334 - 0.241| = 0.093 m; motors are ABOVE the CG
      #   => body z = -0.093 m (FRD, +Z down).
      motor_plane_to_cg_abs_m: 0.093
      motor_plane_body_z_m: -0.093
      # |0.241 - 0.220| = 0.021 m; battery is BELOW the CG
      #   => body z = +0.021 m (FRD, +Z down).
      cg_to_battery_abs_m: 0.021
      battery_body_z_m: 0.021

# ---------------------------------------------------------------------------
# Hover thrust is NOT stored as a literal anywhere in this file. It is a pure
# function of mass and the caller's gravity constant -- use
# UAVPhysicalParams.hover_thrust_n(g). Storing a scalar would silently go
# stale if mass is re-measured, and would hide which g produced it.
#
# For reference (DERIVED, and an EQUAL-SHARING assumption for the per-motor
# figure -- the real vehicle's CG offset means the four motors do not share
# hover thrust exactly):
#   g = 9.8065   (landing_rl.envs.landing_env.LandingConfig.gravity_mps2)
#     total  = 6.408 * 9.8065   = 62.8401 N
#     /motor = 15.7100 N = 1.6020 kgf
#   g = 9.80665 (hardcoded in landing_mujoco actuation_model / MJCF)
#     total  = 6.408 * 9.80665  = 62.8410 N
#     /motor = 15.7103 N = 1.6020 kgf   (corrected 2026-09-19: previously
#                                        recorded as 15.7102 N / 1.6021 kgf)
# The two gravity constants differing is a PRE-EXISTING repository
# discrepancy, recorded here but deliberately NOT reconciled (that would
# be a behavior change).
# ---------------------------------------------------------------------------
