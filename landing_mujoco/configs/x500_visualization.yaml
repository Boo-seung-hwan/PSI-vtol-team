# x500 visual shell -- VISUALIZATION ONLY.
#
# Nothing in this file affects mass, CG, inertia, physical motor positions,
# landing-gear collision geometry, thrust, torque, contact, the controller, or
# the observation/action contract. Those come only from the physical
# parameter YAML (tarot680b_reference.yaml / ugrp_vehicle_measured.yaml).
# Visual ON vs OFF is tested to give identical physics
# (landing_mujoco/tests/test_visual_physics_invariance.py).
#
# Transform layers (kept separate):
#   converted mesh (COLLADA node transforms baked)
#   -> x500 SDF link/visual pose + mesh scale   (assets_dir/x500_native_assembly.json)
#   -> UGRP display alignment below: p_body = t + R (s * p_native)
#
# Landing gear (decision 2026-09-14): the shell contains only the x500 upper
# structure. The landing gear shown in the viewer is the PHYSICAL contact
# geometry (geom group 0); the placeholder markers move to hidden group 3.

visualization:
  enabled: true
  model: x500
  assets_dir: landing_mujoco/assets/x500_visual

  # auto: derived from the source SDF rotor link poses in the manifest,
  #   2 * sqrt(0.174^2 + 0.174^2) = 0.4921463... m
  source_wheelbase_m: auto

  # Current PROVISIONAL Tarot TL680B visual target. Replace with the measured
  # UGRP wheelbase (or set to from_physical_params) -- YAML edit only.
  target_wheelbase_m: 0.737

  # auto: target_wheelbase_m / source_wheelbase_m (~1.4975 today)
  uniform_scale: auto

  # FRD policy body frame (same convention as every *_body_m vector in the
  # physical configs); converted to MuJoCo only by coordinates/transforms.py.
  translation_body_m: [0.0, 0.0, 0.0]
  rotation_rpy_rad: [0.0, 0.0, 0.0]
